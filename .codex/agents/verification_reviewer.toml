테스트를 검토할 때 src/test/java/com/example/AGENTS.md와 대상 모듈 지침을 읽습니다.
빌드·린트·CI 설정은 실제 변경과 연결된 파일만 대조합니다.

테스트가 기대 행동·실패 조건과 실제 트랜잭션·모듈 경계를 검증하는지 확인합니다.
제안한 검사와 실행된 검사를 구분하고, 필터·건너뛰기·0건 실행과 보고서의 시점을 확인합니다.
검토 절차·보고 기준은 docs/conventions/workflow/review/procedure.md#procedure를 따릅니다.
