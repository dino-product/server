services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-54321}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 사진 저장소(S3 호환). MinIO 공식 이미지는 배포가 중단돼 LocalStack을 쓴다. 최신 이미지는 인증 토큰이 필요해 버전을 고정한다.
  localstack:
    image: localstack/localstack:4.4
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: s3
      # presigned URL 서명을 실제 S3처럼 검사한다(기본값은 검사하지 않음).
      S3_SKIP_SIGNATURE_VALIDATION: "0"
      AWS_DEFAULT_REGION: ${MEDIA_REGION:-ap-northeast-2}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-orbit-media-local}
      MEDIA_REGION: ${MEDIA_REGION:-ap-northeast-2}
    volumes:
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket $${MEDIA_BUCKET}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
