spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  docker:
    compose:
      enabled: false

decorator:
  datasource:
    p6spy:
      enable-logging: false

management:
  server:
    port: 0

logging:
  level:
    root: WARN
    org.testcontainers: INFO

app:
  auth:
    kakao:
      allowed-audiences: test-kakao-app-key
    apple:
      allowed-audiences: test-apple-bundle-id,test-apple-services-id
    jwt:
      secret: test-only-secret-key-with-at-least-32-bytes
      issuer: orbit-test
      access-token-ttl: PT1H
