spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  docker:
    compose:
      enabled: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

decorator:
  datasource:
    p6spy:
      enable-logging: false

management:
  server:
    port: 0

logging:
  level:
    root: WARN
    org.testcontainers: INFO

app:
  auth:
    kakao:
      allowed-audiences: test-kakao-app-key
      admin-api:
        # 테스트가 실제 카카오를 부르지 않도록 닫힌 로컬 주소를 둔다. 연결 끊기를 검사하는 테스트는 스텁 주소로 바꾼다.
        unlink-uri: http://127.0.0.1:1/v1/user/unlink
        admin-key: test-kakao-admin-key
    apple:
      allowed-audiences: test-apple-bundle-id,test-apple-services-id
      client-secret:
        team-id: TESTTEAM01
        key-id: TESTKEY001
        # 실제 키가 아닌 자리표시자. client_secret을 만드는 테스트는 실행 중 생성한 키를 넣는다.
        private-key: test-placeholder-not-a-key
        ttl: PT10M
      refresh-token:
        # 테스트 전용 키(base64 32바이트)
        encryption-key: dGVzdC1vbmx5LWFwcGxlLXJlZnJlc2gta2V5LTMyYnk=
      web:
        services-id: test-apple-services-id
        redirect-uri: http://localhost/api/v1/auth/apple/callback
        return-uris:
          web: http://localhost:3000/login/apple
          android: orbit-test://auth/apple
    closed-account:
      reconfirm-enabled: false
    provider-unlink:
      # 주기 작업은 끈다. 재시도·재확정을 검사하는 테스트는 유즈케이스를 직접 부른다.
      retry-enabled: false
    jwt:
      secret: test-only-secret-key-with-at-least-32-bytes
      issuer: orbit-test
      access-token-ttl: PT1H
  notification:
    push-delivery:
      # 주기 작업은 끈다. 발신 대기열을 검사하는 테스트는 처리를 직접 부른다.
      enabled: false
  events:
    resubmission:
      # 주기 작업은 끈다. 재전송을 검사하는 테스트는 재전송을 직접 부른다.
      enabled: false
