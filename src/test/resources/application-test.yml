spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  docker:
    compose:
      enabled: false

decorator:
  datasource:
    p6spy:
      enable-logging: false

management:
  server:
    port: 0

logging:
  level:
    root: WARN
    org.testcontainers: INFO

app:
  auth:
    kakao:
      allowed-audiences: test-kakao-app-key
    apple:
      allowed-audiences: test-apple-bundle-id,test-apple-services-id
      client-secret:
        team-id: TESTTEAM01
        key-id: TESTKEY001
        # 실제 키가 아닌 자리표시자. client_secret을 만드는 테스트는 실행 중 생성한 키를 넣는다.
        private-key: test-placeholder-not-a-key
        ttl: PT10M
      refresh-token:
        # 테스트 전용 키(base64 32바이트)
        encryption-key: dGVzdC1vbmx5LWFwcGxlLXJlZnJlc2gta2V5LTMyYnk=
      web:
        services-id: test-apple-services-id
        redirect-uri: http://localhost/api/v1/auth/apple/callback
        return-uris:
          web: http://localhost:3000/login/apple
          android: orbit-test://auth/apple
    jwt:
      secret: test-only-secret-key-with-at-least-32-bytes
      issuer: orbit-test
      access-token-ttl: PT1H
  media:
    retention-max-days: 30
    # 저장소에 닿지 않는 주소. 서명만 하는 발급·조회 주소는 동작하고, 저장소를 부르는 확인은 실패한다.
    # 실제 업로드가 필요한 테스트는 LocalStack 컨테이너 주소로 바꾼다(LocalStackTestSupport).
    storage:
      bucket: orbit-media-test
      region: ap-northeast-2
      endpoint: http://127.0.0.1:9
      path-style-access: true
      access-key-id: test
      secret-access-key: test
      api-call-timeout: PT2S
      api-call-attempt-timeout: PT1S
