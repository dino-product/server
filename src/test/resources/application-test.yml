spring:
  config:
    activate:
      on-profile: "test & !prod"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      jakarta.persistence.sql-load-script-source: db/organization-schema.sql
  docker:
    compose:
      enabled: false

decorator:
  datasource:
    p6spy:
      enable-logging: false

management:
  server:
    port: 0

logging:
  level:
    root: WARN
    org.testcontainers: INFO
