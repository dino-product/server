spring:
  jpa:
    open-in-view: false
  flyway:
    # 테스트 전용 Entity의 테이블(db/test-migration)을 운영 마이그레이션 뒤에 더한다.
    locations: classpath:db/migration,classpath:db/test-migration
  docker:
    compose:
      enabled: false

decorator:
  datasource:
    p6spy:
      enable-logging: false

management:
  server:
    port: 0

logging:
  level:
    root: WARN
    org.testcontainers: INFO
    # 닫힌 로컬 주소로 보낸 좌표 조회의 실패 경고는 테스트마다 반복되므로 감춘다.
    com.orbit.schedule.adapter.out.kakao: ERROR

app:
  auth:
    kakao:
      allowed-audiences: test-kakao-app-key,test-kakao-rest-api-key
      admin-api:
        # 테스트가 실제 카카오를 부르지 않도록 닫힌 로컬 주소를 둔다. 연결 끊기를 검사하는 테스트는 스텁 주소로 바꾼다.
        unlink-uri: http://127.0.0.1:1/v1/user/unlink
        admin-key: test-kakao-admin-key
      web:
        # 토큰 교환도 닫힌 로컬 주소에 둔다. 웹 로그인 API 테스트는 스텁 주소로 바꾼다.
        token-uri: http://127.0.0.1:1/oauth/token
        rest-api-key: test-kakao-rest-api-key
        client-secret: test-kakao-client-secret
        redirect-uri: http://localhost/api/v1/auth/kakao/callback
        return-uris:
          web: http://localhost:3000/login/kakao
    apple:
      allowed-audiences: test-apple-bundle-id,test-apple-services-id
      client-secret:
        team-id: TESTTEAM01
        key-id: TESTKEY001
        # 실제 키가 아닌 자리표시자. client_secret을 만드는 테스트는 실행 중 생성한 키를 넣는다.
        private-key: test-placeholder-not-a-key
        ttl: PT10M
      refresh-token:
        # 테스트 전용 키(base64 32바이트)
        encryption-key: dGVzdC1vbmx5LWFwcGxlLXJlZnJlc2gta2V5LTMyYnk=
      web:
        services-id: test-apple-services-id
        redirect-uri: http://localhost/api/v1/auth/apple/callback
        return-uris:
          web: http://localhost:3000/login/apple
    closed-account:
      reconfirm-enabled: false
    provider-unlink:
      # 주기 작업은 끈다. 재시도·재확정을 검사하는 테스트는 유즈케이스를 직접 부른다.
      retry-enabled: false
    jwt:
      secret: test-only-secret-key-with-at-least-32-bytes
      issuer: orbit-test
      access-token-ttl: PT1H
  media:
    retention-max-days: 30
    # 저장소에 닿지 않는 주소. 서명만 하는 발급·조회 주소는 동작하고, 저장소를 부르는 확인은 실패한다.
    # 실제 업로드가 필요한 테스트는 LocalStack 컨테이너 주소로 바꾼다(LocalStackTestSupport).
    storage:
      bucket: orbit-media-test
      region: ap-northeast-2
      endpoint: http://127.0.0.1:9
      path-style-access: true
      access-key-id: test
      secret-access-key: test
      api-call-timeout: PT2S
      api-call-attempt-timeout: PT1S
  schedule:
    geocoding:
      kakao:
        # 테스트가 실제 카카오를 부르지 않도록 닫힌 로컬 주소를 둔다(연결이 바로 거절돼 좌표 없이 저장). 좌표를 검사하는 테스트는 포트를 바꾼다.
        address-search-uri: http://127.0.0.1:1/v2/local/search/address.json
        rest-api-key: test-kakao-rest-api-key
  notification:
    push-delivery:
      # 주기 작업은 끈다. 발신 대기열을 검사하는 테스트는 처리를 직접 부른다.
      enabled: false
  events:
    resubmission:
      # 주기 작업은 끈다. 재전송을 검사하는 테스트는 재전송을 직접 부른다.
      enabled: false
