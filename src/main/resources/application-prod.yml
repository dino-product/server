# 운영. 배포 공통 설정(application-deployed.yml)에 더해 개발 서버와 다른 값만 둔다.
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  notification:
    push:
      fcm:
        # 운영은 기사 앱 푸시를 실제로 보낸다. FCM_CREDENTIALS가 없으면 기동하지 않는다.
        enabled: true
