# 배포 환경(dev·prod) 공통 설정. 그룹으로 켜진 이 프로필이 application-dev·prod.yml보다 우선하므로, 환경마다 다른 값은 여기 두지 않는다.
spring:
  config:
    activate:
      on-profile: deployed
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

decorator:
  datasource:
    p6spy:
      enable-logging: false

app:
  schedule:
    # 진행 보드 캐시는 캐시 전용 Redis(infra redis-cache)가 있을 때만 켠다. 로그인·실시간용 Redis(noeviction)에 캐시를 두지 않는다.
    board-cache:
      enabled: ${BOARD_CACHE_ENABLED:false}
      shared-redis-fallback: false
