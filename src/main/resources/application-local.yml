spring:
  config:
    activate:
      on-profile: "local & !deployed"
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:54321/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

decorator:
  datasource:
    p6spy:
      enable-logging: ${P6SPY_ENABLE_LOGGING:true}

app:
  media:
    retention-max-days: ${MEDIA_RETENTION_MAX_DAYS:30}
    # docker compose의 LocalStack. 버킷은 docker/localstack/init/ready.d/create-media-bucket.sh가 만든다.
    storage:
      bucket: ${MEDIA_BUCKET:orbit-media-local}
      region: ${MEDIA_REGION:ap-northeast-2}
      endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:4566}
      path-style-access: ${MEDIA_S3_PATH_STYLE_ACCESS:true}
      access-key-id: ${MEDIA_S3_ACCESS_KEY_ID:test}
      secret-access-key: ${MEDIA_S3_SECRET_ACCESS_KEY:test}
