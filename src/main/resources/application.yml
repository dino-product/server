server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    threads:
      # 동시에 처리하는 요청 수와 스레드 스택 메모리의 상한. 넘는 요청은 접속 대기열에서 기다린다. 실시간 연결(SSE)은 비동기라 스레드를 붙잡지 않는다.
      max: 60
    mbeanregistry:
      # 바쁜 스레드 수 같은 Tomcat 지표(tomcat.threads.*)를 내보낸다.
      enabled: true

spring:
  application:
    name: orbit-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        # 주기 작업(폐쇄 표시 재확정, 외부 연결 해제 재시도, 실패 발행 재전송, 멈춘 발행 검사, 발신 대기열 처리)마다 스레드를 둬
        # 제공자 장애로 한 작업이 길어져도 다른 작업이 밀리지 않게 한다
        size: 5
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
      lifecycle-management: start-and-stop
  profiles:
    # 배포 환경(dev·prod)은 공통 설정 deployed를 함께 켠다.
    group:
      dev: deployed
      prod: deployed
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      # 커넥션이 모두 쓰이고 있을 때 기다리는 시간. 넘으면 503과 Retry-After로 빨리 거절해, 요청이 몰릴 때 기다리는 요청이 스레드·메모리를 붙잡고 쌓이지 않게 한다.
      connection-timeout: 3000
      # 빌려줄 커넥션이 살아 있는지 확인하는 한도. 커넥션 대기 한도보다 짧아야 대기 한도를 넘겨 막히지 않는다.
      validation-timeout: 2000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션(db/migration)이 만든다. Hibernate는 매핑이 스키마와 맞는지만 확인한다.
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        default_schema: public
  flyway:
    # Hibernate가 검증하는 스키마(default_schema)와 같은 곳에 만든다. 접속 사용자 이름과 같은 스키마가 있어도 그쪽에 만들지 않는다.
    default-schema: public
  modulith:
    events:
      # 모듈 리스너(@ApplicationModuleListener)로 가는 이벤트만 발행 트랜잭션 안에서 event_publication에 기록한다.
      registry-trigger-annotation: org.springframework.modulith.events.ApplicationModuleListener
      # 처리를 마친 발행은 지우지 않고 이벤트 원문과 함께 event_publication_archive로 옮긴다.
      completion-mode: archive
      # 재기동 때 미완료 발행을 한꺼번에 다시 보내지 않는다. 여러 인스턴스가 같은 발행을 겹쳐 보내기 때문이다.
      republish-outstanding-events-on-restart: false
      staleness:
        # 대기·처리·재전송 중인 채로 이 시간을 넘긴 발행(인스턴스 중단 등)은 실패로 바꿔 재전송 대상으로 만든다. 최초 발행 시각 기준이다.
        published: PT5M
        processing: PT5M
        resubmitted: PT5M
        check-interval: PT1M
      jdbc:
        schema-initialization:
          # 기록 테이블도 Flyway 마이그레이션(db/migration)이 만든다. 모든 프로필에서 Modulith가 스키마를 만들지 않는다.
          enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: false

springdoc:
  use-fqn: true
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /docs-json
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /docs
    disable-swagger-default-url: true

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:default}
    # 응답 시간 p95·p99를 Prometheus에서 계산할 수 있게 요청 지표를 히스토그램 버킷으로 낸다.
    distribution:
      percentiles-histogram:
        http.server.requests: true

decorator:
  datasource:
    p6spy:
      enable-logging: ${P6SPY_ENABLE_LOGGING:false}
      multiline: false
      logging: slf4j

logging:
  level:
    root: INFO
    com.orbit: ${LOGGING_APP_LEVEL:INFO}
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    # 멈춤 검사가 멈춘 발행이 없어도 1분마다 상태별 INFO를 남긴다. 리스너 실패는 비동기 실행기가 ERROR로 남기고, 다시 보내지 못한 발행은 event_publication에 FAILED로 남는다.
    org.springframework.modulith.events.core.DefaultEventPublicationRegistry: WARN

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173}
  auth:
    kakao:
      issuer: https://kauth.kakao.com
      jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
      allowed-audiences: ${KAKAO_ALLOWED_AUDIENCES}
      admin-api:
        unlink-uri: https://kapi.kakao.com/v1/user/unlink
        admin-key: ${KAKAO_ADMIN_KEY}
        timeout: PT5S
      web:
        authorization-uri: https://kauth.kakao.com/oauth/authorize
        token-uri: https://kauth.kakao.com/oauth/token
        rest-api-key: ${KAKAO_REST_API_KEY}
        client-secret: ${KAKAO_CLIENT_SECRET}
        redirect-uri: ${KAKAO_WEB_REDIRECT_URI}
        timeout: PT5S
        return-uris:
          web: ${KAKAO_WEB_RETURN_URI}
    apple:
      issuer: https://appleid.apple.com
      jwk-set-uri: https://appleid.apple.com/auth/keys
      allowed-audiences: ${APPLE_ALLOWED_AUDIENCES}
      client-secret:
        team-id: ${APPLE_TEAM_ID}
        key-id: ${APPLE_KEY_ID}
        private-key: ${APPLE_PRIVATE_KEY}
        ttl: ${APPLE_CLIENT_SECRET_TTL:PT10M}
      token-api:
        token-uri: https://appleid.apple.com/auth/token
        revoke-uri: https://appleid.apple.com/auth/revoke
        timeout: PT5S
      refresh-token:
        encryption-key: ${APPLE_REFRESH_TOKEN_ENCRYPTION_KEY}
      web:
        authorization-uri: https://appleid.apple.com/auth/authorize
        services-id: ${APPLE_SERVICES_ID}
        redirect-uri: ${APPLE_WEB_REDIRECT_URI}
        return-uris:
          web: ${APPLE_WEB_RETURN_URI}
    closed-account:
      # 커밋 뒤 폐쇄 표시 저장이 실패했을 때를 대비해 최근 폐쇄 계정의 표시를 다시 남기는 주기
      reconfirm-enabled: true
      reconfirm-interval: PT1M
    provider-unlink:
      # 탈퇴한 계정의 카카오 연결 끊기·Apple 토큰 철회 재시도 주기
      retry-enabled: true
      retry-interval: PT1M
    jwt:
      secret: ${AUTH_JWT_SECRET}
      issuer: ${AUTH_JWT_ISSUER:orbit}
      access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT1H}
    refresh-token:
      # 마지막 발급부터 이 기간 동안 재발급하지 않으면 그 기기 세션이 만료된다. 재발급할 때마다 다시 센다.
      idle-lifetime: ${AUTH_REFRESH_TOKEN_IDLE_LIFETIME:P30D}
  profile:
    terms:
      # 시행 중인 약관 버전. 필수 약관(service·privacy) 값을 올리면 기존 계정은 재동의 전까지 이용이 막힌다.
      versions:
        service: "2026-10-10"
        privacy: "2026-10-10"
        marketing: "2026-10-10"
  organization:
    lock:
      wait-limit: ${ORGANIZATION_LOCK_WAIT_LIMIT:}
  schedule:
    technician-lock:
      wait-limit: ${SCHEDULE_TECHNICIAN_LOCK_WAIT_LIMIT:}
    # 현장 사진 장당 용량(바이트). 기획 미정(JOB-003)이라 비우면 저장소 한도(5GiB)만 적용한다.
    site-photo:
      max-bytes: ${SCHEDULE_SITE_PHOTO_MAX_BYTES:}
  media:
    # 이미지 시그니처로 확인할 수 있는 형식만 둘 수 있다(ImageFormat).
    image-content-types: ${MEDIA_IMAGE_CONTENT_TYPES:image/jpeg,image/png,image/webp,image/heic,image/heif}
    # 저장소 수명 주기 규칙이 허용하는 보관 기간 상한(일, infra와 공유). 용도별 보관 기간(retention-days)이 넘으면 기동에 실패한다.
    retention-max-days: ${MEDIA_RETENTION_MAX_DAYS}
    storage:
      bucket: ${MEDIA_BUCKET}
      region: ${MEDIA_REGION}
      # S3 호환 저장소(로컬 LocalStack 등)만 준다. 비우면 AWS 기본 주소와 기본 자격 증명 체인(노드 역할)을 쓴다.
      endpoint: ${MEDIA_S3_ENDPOINT:}
      path-style-access: ${MEDIA_S3_PATH_STYLE_ACCESS:false}
      upload-url-ttl: PT10M
      download-url-ttl: PT10M
      api-call-timeout: PT5S
      api-call-attempt-timeout: PT3S
      # 복사(CopyObject)만 쓰는 호출·시도 제한 시간. 서버 쪽 복사 시간이 사진 크기에 비례한다. api-call-timeout 이상.
      copy-timeout: PT60S
  notification:
    push-delivery:
      # 기사 앱 푸시 발신 대기열을 확인하는 주기와 한 번에 집는 건수. 보내는 중인 채로 in-flight-timeout이 지난 발신(인스턴스 중단 등)은 다시 집는다.
      # 다시 보낼 실패는 횟수 제한 없이 initial-backoff부터 실패마다 두 배, max-backoff까지 기다렸다 다시 보낸다.
      enabled: true
      interval: PT5S
      batch-size: 100
      in-flight-timeout: PT5M
      initial-backoff: PT30S
      max-backoff: PT30M
    push:
      fcm:
        # 기사 앱 푸시 제공자 FCM(HTTP v1). credentials는 Firebase 서비스 계정 키(JSON)를 base64로 인코딩한 값이며 켰을 때만 필요하다.
        # 운영(prod)은 항상 켜고, 끄면 local·test·dev는 보내지 않고 기록만 하는 발신기를 쓴다(그 밖의 환경은 발신기가 없어 기동하지 않는다).
        # timeout은 토큰 발급과 발신 호출의 연결·읽기 제한 시간이다.
        enabled: ${FCM_ENABLED:false}
        credentials: ${FCM_CREDENTIALS:}
        api-uri: https://fcm.googleapis.com
        timeout: ${FCM_TIMEOUT:PT5S}
  events:
    resubmission:
      # 실패한 이벤트 발행을 확인하는 주기. 처리될 때까지 횟수 제한 없이 다시 보내며, 실패한 시도마다 다음 재전송까지 기다리는 시간을 두 배로 늘린다.
      enabled: true
      interval: PT1M
      initial-backoff: PT1M
      max-backoff: PT30M
