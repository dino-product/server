name: deploy-dev
on:
  push:
    branches: [develop]
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew bootJar --no-daemon
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::714047901967:role/gh-server-dev
          aws-region: ap-northeast-2
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/orbit/server:${{ github.sha }}

  # infra 레포 values-dev.yaml의 이미지 태그를 커밋으로 바꾼다: dev 클러스터의 Argo CD가 감지해 배포
  deploy:
    needs: build
    # 앱이 dev에서 뜨기 전까지는 꺼 둔다. 켜기: gh variable set DEPLOY_DEV --body true
    if: vars.DEPLOY_DEV == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # AWS를 쓰지 않고 infra 푸시는 deploy key(INFRA_DEPLOY_KEY)로 한다 → 토큰 권한이 필요 없다
    permissions: {}
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VALUES: charts/orbit-server/values-dev.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dino-product/infra
          ref: main
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          path: infra
      - name: 이미지 태그 바꾸기
        id: bump
        working-directory: infra
        run: |
          OLD=$(yq '.image.tag' "$VALUES")
          if [ "$OLD" = "$TAG" ]; then
            echo "infra에 이미 ${TAG::7} 태그가 있어 커밋하지 않습니다"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # yq -i는 파일 전체의 { a: b }를 {a: b}로 다시 쓴다 → 태그 줄의 값만 글자 그대로 바꾸고 결과는 yq로 확인
          LINE=$(yq '.image.tag | line' "$VALUES")
          sed -i "${LINE}s/${OLD//./\\.}/$TAG/" "$VALUES"
          if ! yq -e '.image.tag == strenv(TAG) and (.image.tag | tag) == "!!str"' "$VALUES" >/dev/null; then
            echo "::error::${VALUES}의 image.tag를 ${TAG}(문자열)로 바꾸지 못했습니다"
            exit 1
          fi
          git diff
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: infra main에 커밋 · 푸시
        id: push
        if: steps.bump.outputs.changed == 'true'
        working-directory: infra
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$VALUES"
          git commit -m "chore(dev): orbit-server ${TAG::7}" -m "dino-product/server@$TAG"
          # 그사이 다른 infra 커밋이 들어와 거절되면 rebase 후 다시 민다 (최대 3번)
          for i in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$i" = 3 ]; then echo "::error::infra main 푸시가 3번 실패했습니다"; exit 1; fi
            git pull --rebase origin main
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 요약
        env:
          CHANGED: ${{ steps.bump.outputs.changed }}
          INFRA_SHA: ${{ steps.push.outputs.sha }}
        run: |
          {
            echo "### dev 배포 이미지: \`$TAG\`"
            if [ "$CHANGED" = true ]; then
              echo "- infra 커밋 [\`${INFRA_SHA::7}\`](https://github.com/dino-product/infra/commit/$INFRA_SHA): \`$VALUES\`의 \`image.tag\`"
            else
              echo "- infra에 이미 같은 태그가 있어 커밋하지 않았습니다"
            fi
            echo "- 이 job은 커밋까지만 합니다. Argo CD가 Git을 약 3분마다 확인해 반영하니 결과는 [Argo CD orbit-server](https://argocd.dev.orbi-t.com/applications/argocd/orbit-server)에서 확인합니다"
          } >> "$GITHUB_STEP_SUMMARY"
