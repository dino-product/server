name: deploy-dev
on:
  push:
    branches: [develop]
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew bootJar --no-daemon
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::714047901967:role/gh-server-dev
          aws-region: ap-northeast-2
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/orbit/server:${{ github.sha }}

  # dev 노드에 SSM Run Command로 배포한다: 번들(차트 · deploy.sh)을 받아 helm upgrade
  deploy:
    needs: build
    # 앱이 dev에서 뜨기 전까지는 꺼 둔다. 켜기: gh variable set DEPLOY_DEV --body true
    if: vars.DEPLOY_DEV == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.build.outputs.tag }}
      BUCKET: orbit-deploy-714047901967
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::714047901967:role/gh-server-dev
          aws-region: ap-northeast-2
      - name: dev 노드 확인
        id: node
        run: |
          read -r ID PING <<<"$(aws ssm describe-instance-information \
            --filters Key=tag:Env,Values=dev Key=tag:Role,Values=k3s \
            --query 'InstanceInformationList[0].[InstanceId,PingStatus]' --output text)"
          echo "node=$ID ssm=$PING"
          if [ "$PING" != "Online" ]; then
            echo "::error::dev 노드가 꺼져 있거나 SSM에 연결되지 않았습니다. 켜고 Re-run 하세요"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: SSM으로 배포
        env:
          NODE: ${{ steps.node.outputs.id }}
        run: |
          CMDS=$(jq -nc --arg b "$BUCKET" --arg t "$TAG" '{commands: [
            "set -e",
            "aws s3 cp s3://\($b)/bundle/latest.tgz /tmp/bundle.tgz --region ap-northeast-2",
            "rm -rf /opt/orbit && mkdir -p /opt/orbit && tar xzf /tmp/bundle.tgz -C /opt/orbit",
            "bash /opt/orbit/scripts/deploy.sh dev \($t)"]}')
          CID=$(aws ssm send-command --document-name AWS-RunShellScript \
            --instance-ids "$NODE" --parameters "$CMDS" --timeout-seconds 900 \
            --comment "deploy dev ${TAG::7}" --query Command.CommandId --output text)
          echo "command: $CID"

          # 최대 15분 기다린다 (helm 제한 시간 10분 + 이미지 받기)
          ST=Pending
          for _ in $(seq 1 90); do
            sleep 10
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$NODE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          # get-command-invocation은 출력을 24,000자까지 준다 (list-command-invocations는 2,500자)
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$NODE" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$NODE" \
            --query StandardErrorContent --output text >&2
          echo "status: $ST"
          [ "$ST" = "Success" ]
