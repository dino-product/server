name: PR conventions

# 변경 Markdown의 상대 링크·앵커 실재만 기계로 판정한다.
# 제목·라벨·본문 양식은 검사하지 않고 작성자와 리뷰가 맡는다.
# 기준: docs/conventions/workflow/review/automation.md
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: PR conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test check scripts
        run: python3 -m unittest discover -s .github/scripts/tests

      - name: Check links and anchors in changed Markdown
        if: always()
        run: >-
          python3 .github/scripts/check_markdown_links.py
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}
