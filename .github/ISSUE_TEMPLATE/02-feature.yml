name: 기능 제안
description: 새 기능이나 외부 동작 개선의 필요성과 완료 조건을 정의합니다.
labels: ["type:feat", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        제목에는 사용자나 호출자가 얻을 결과를 적어 주세요. 같은 요구가 등록되어 있다면 기존 이슈에 연결해 주세요.
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      description: 누가 어떤 상황에서 겪는 문제인가요? 현재 방법의 한계도 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
      description: 입력·행동·결과의 구체적인 예를 적어 주세요. 구현 방법이 결정되지 않아도 됩니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 구현 후 관찰하거나 검사할 수 있는 조건을 적어 주세요. 아직 합의되지 않은 조건은 제안으로 표시해 주세요.
      placeholder: |
        - [ ] 특정 조건에서 기대한 결과를 얻을 수 있다.
        - [ ] 실패 조건에서 정해진 오류를 확인할 수 있다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위와 제약
      description: 이번에 포함하거나 제외할 범위, API·데이터 호환성, 운영 제약이 있으면 적어 주세요.
  - type: textarea
    id: alternatives
    attributes:
      label: 대안과 관련 자료
      description: 고려한 대안, 관련 이슈·설계·계약 문서를 연결해 주세요.
