name: 버그 신고
description: 기대한 동작과 실제 동작이 다른 문제를 재현 정보와 함께 기록합니다.
labels: ["type:fix", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        같은 문제가 등록되어 있는지 먼저 확인해 주세요. 제목에는 발생 조건과 증상을 적어 주세요.
        로그·요청 예제에서 비밀값과 개인정보를 제거하고, 확인하지 못한 내용은 미확인으로 표시해 주세요.
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작과 영향
      description: 어떤 상황에서 무엇이 잘못되며, 누구에게 얼마나 자주 영향을 주나요?
      placeholder: 특정 입력으로 API를 호출하면 어떤 응답이 발생하는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상이라면 어떤 결과여야 하나요? 근거가 되는 API 계약이나 문서가 있으면 연결해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 사전 조건, 최소 입력과 실행 순서를 적어 주세요. 재현이 어려우면 관찰한 조건과 빈도를 적어 주세요.
      placeholder: |
        1. 사전 조건 또는 데이터
        2. 실행한 요청이나 명령
        3. 관찰한 결과
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 발생 환경
      description: 확인한 버전 또는 커밋, 활성 프로필, 실행 방식을 적어 주세요. 관련이 있으면 JDK·DB·OS 정보도 포함해 주세요.
      placeholder: 확인한 정보만 작성하고, 알 수 없는 항목은 미확인으로 표시해 주세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 근거와 관련 자료
      description: 필요한 로그 발췌, 실패 테스트, 화면, 관련 이슈를 연결해 주세요. 원인 추정은 관찰 사실과 구분해 주세요.
